name: Bug report
description: Report a bug or unexpected behavior
title: "[BUG]: "
labels: ["bug"]

body:
  - type: input
    id: description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: Describe the bug clearly.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Affected Area
      options:
        - CLI
        - API
        - Dashboard
        - Configuration
        - CI / Release
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run command...
        2. Configure...
        3. See error
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Expected and Actual Behavior
      description: | 
        What actually happened?
        What should have happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. v1.2.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Paste logs or error messages.
      render: shell
